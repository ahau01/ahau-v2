schema: spec-driven

# Compact context for OpenSpec artifacts. CLAUDE.md remains the source for
# project-wide care and engineering practices; keep this subset aligned.
context: |
  Āhau v2 is a whakapapa app built on Holochain. Its data can be personal,
  collective, culturally significant, sensitive or contested. Consider data
  sovereignty, consent, privacy, provenance, context and human authority when
  shaping how information is collected, stored, shared or presented.

  Integrity zomes define data types and validation; coordinator zomes expose
  workflows. Source chains record authored actions, while DHT data propagates
  across peers and may be partially or temporarily unavailable. Design for
  Holochain's model rather than assuming a centralized, globally current
  database.

  `openspec/specs/` describes current behavior. An active change owns its
  scope, requirements, design and tasks. `CLAUDE.md` carries project-wide
  care and engineering practices; `CONTEXT.md` carries domain vocabulary.

rules:
  proposal:
    - Link the originating GitHub issue, when there is one
    - For changes involving sensitive data, describe who is affected and any unresolved questions about access, authority or use
    - Keep adjacent concerns visible for review rather than quietly expanding scope
  specs:
    - Describe observable behavior and relevant expectations for privacy, authorship, provenance and access
  design:
    - Explain relevant Holochain effects on validation, source-chain writes, DHT distribution, visibility and existing data
    - Surface consequential assumptions and tradeoffs that need human direction
  tasks:
    - Choose checks that match the behavior; use conductor-backed tests when correctness depends on Holochain validation, synchronization or access semantics
