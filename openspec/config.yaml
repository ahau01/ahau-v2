schema: spec-driven

# Constraints from CLAUDE.md that an agent cannot infer from the code.
# CLAUDE.md is the source of truth; keep this in step with it.
context: |
  Āhau v2 rebuilds the Āhau whakapapa app directly on Holochain. It encodes
  kaupapa Māori principles (data sovereignty, non-erasure of contested
  authority, decentralisation) into its architecture. The conventional
  pattern is often wrong for this data model.

  Four things not to do:
  1. No canonical version of relationship or identity data. No
     last-write-wins, single-source-of-truth, or overwrite-on-conflict,
     including during sync and in how entries are updated or linked. The
     answer is usually "represent both"; choosing which version to show is a
     render-layer decision, per viewer.
  2. Relationships are assertions from a source ("source X asserts
     relationship Y"), with multiple sources coexisting, not editable edges.
  3. No assumed central authority. No primary database, centralised storage,
     or single node/agent as source of truth.
  4. Identity is not session auth. No email/password, sessions, JWT or OAuth.
     Identity is an agent's public key; a device holding a key is not "a
     logged-in user", and multi-device use must hold.

  Holochain is not a database: DHT reads can be stale or incomplete, and
  nothing is erased (removal is retraction). Zome calls stay inside
  per-feature client modules; components never call Holochain directly.

  The typed contract in reference/leg1-contract/contract/ is frozen reference,
  a checklist of what the old app could do (ADR-0006). It is not the spec,
  and new code must not match it operation-for-operation.

  GitHub issues (ahau01/ahau-v2) are the backlog; a change's scope and
  design live in the change, not on the issue. ADRs live in docs/adr/.

rules:
  proposal:
    - Link the GitHub issue the change comes from, if there is one
    - If the change touches relationship or identity data, sync, or access control, say so up front and name which of the four rules it bears on
    - If the change touches relationship storage, state how multi-source assertions are preserved
    - Anything outside the change's explicit scope goes under a "Flagged, not done" heading rather than into the plan
    - If a requirement seems to need a canonical value or a central authority, flag it as an open question instead of designing for it
  specs:
    - Where sources can disagree, write scenarios in which conflicting assertions from two sources both survive
    - Permission requirements must hold at sync time and cache time, not just read time
  design:
    - For merge-sensitive mutations, explain why not the conventional alternative (e.g. update as replace-the-latest)
    - Describe what happens when two devices go offline, make conflicting edits, then sync
    - Describe what happens to already-synced data if permissions change afterward, including a revoked member's local copy
    - Enforce permissions in validation rules and capability grants, not only in the UI or client
  tasks:
    - Conflict-handling and permission logic need tests against a real conductor (Tryorama or Sweettest), not mocked sync state
    - Include explicit two-devices-offline-then-sync test tasks where sync or conflict behaviour is involved
